# SQLite version 3.x
#   gem install sqlite3-ruby (not necessary on OS X Leopard)
development:
  adapter: sqlite3
  database: db/development.sqlite3
  pool: 5
  timeout: 5000
  pragmas:
    journal_mode: WAL
    synchronous: NORMAL
    busy_timeout: 5000
    foreign_keys: ON

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  adapter: sqlite3
  database: db/test.sqlite3
  pool: 5
  timeout: 5000
  pragmas:
    journal_mode: WAL
    synchronous: NORMAL
    busy_timeout: 5000
    foreign_keys: ON

production:
  adapter: sqlite3
  database: <%= ENV.fetch("SQLITE_DATABASE", "db/production.sqlite3") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  pragmas:
    journal_mode: WAL
    synchronous: NORMAL
    busy_timeout: 5000
    foreign_keys: ON
